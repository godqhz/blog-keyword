name: run-keywords

on:
  workflow_dispatch:   # 버튼을 누를 때만 실행

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 키워드 조회
        env:
          SEARCHAD_API_KEY: ${{ secrets.SEARCHAD_API_KEY }}
          SEARCHAD_SECRET_KEY: ${{ secrets.SEARCHAD_SECRET_KEY }}
          SEARCHAD_CUSTOMER_ID: ${{ secrets.SEARCHAD_CUSTOMER_ID }}
        run: python blog_keyword.py
      - name: 대시보드 공개 폴더로 복사
        run: mkdir -p docs && cp results/dashboard.html docs/index.html
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results docs
          git diff --cached --quiet || git commit -m "keywords $(date +%F)"
          git push
